<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Button — vista previa</title></head>
<body>
<div id="root"></div>
<script>
  var R = window.RustDiffUI, h = R.h, root = document.getElementById('root');
  R.mount(root, h('div',{className:'flex flex-wrap items-center gap-3 p-4'},
  h(R.Button,null,'Comparar'),
  h(R.Button,{variant:'outline'},'Abrir archivo'),
  h(R.Button,{variant:'secondary'},'Exportar'),
  h(R.Button,{variant:'ghost'},'Cancelar'),
  h(R.Button,{variant:'destructive'},'Borrar historial'),
  h(R.Button,{size:'sm',className:'gap-2 pr-2'},'Comparar',h(R.KbdGroup,null,h(R.Kbd,null,'⌘'),h(R.Kbd,null,'↵'))),
  h(R.Button,{disabled:true},'Deshabilitado')))
</script>
</body>
</html>

name: CI

# Se ejecuta en cada push y PR a main y a canary (las ramas de aporte)
on:
  push:
    branches: [main, canary]
  pull_request:
    branches: [main, canary]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Test & lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Solo lo que pide Tauri v2 en Linux (WebKitGTK 4.1 y lo que arrastra)
      # mas el toolchain C. El nucleo y la persistencia no necesitan ninguna
      # lib de UI; GTK4/libadwaita/gtksourceview se fueron con la app GTK.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # ── Frontend ─────────────────────────────────────────────────────────
      # `cargo test`/`clippy` no necesitan `desktop/dist` (tauri-codegen solo
      # lo valida con `custom-protocol`), pero el frontend se compila y testea
      # primero: es la mitad de la app.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build the frontend
        working-directory: desktop
        run: pnpm build

      - name: Test the frontend
        working-directory: desktop
        run: pnpm test

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets

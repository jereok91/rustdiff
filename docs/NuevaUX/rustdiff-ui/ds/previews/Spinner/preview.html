<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Spinner — vista previa</title></head>
<body>
<div id="root"></div>
<script>
  var R = window.RustDiffUI, h = R.h, root = document.getElementById('root');
  R.mount(root, h('div',{className:'flex items-center gap-4 p-4'},
    h(R.Button,{size:'sm',disabled:true,className:'min-w-34 gap-2'},h(R.Spinner),'Comparando…'),
    h('span',{className:'text-muted-foreground flex items-center gap-2 text-sm'},h(R.Spinner),'Leyendo archivo…')))
</script>
</body>
</html>

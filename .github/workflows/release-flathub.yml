name: Open PR on Flathub repo for new tag

# Se dispara cuando empujas un tag con formato v*.
#
# El manifest de Flathub compila el shell Tauri desde el tag (Rust offline con
# cargo-sources.json) y toma el frontend ya compilado de un tarball que este
# workflow adjunta al release (`rustdiff-frontend-<version>.tar.gz`, el
# `desktop/dist` de `pnpm build` en el mismo tag). Ver flathub/README.md.
#
# Requiere el secret FLATHUB_PAT: un PAT con permiso para pushear ramas y abrir
# PRs en flathub/com.digitalgex.RustDiff.
#
# Release candidates (`vX.Y.Z-rc.N`) y el dispatch manual NO abren PR en
# Flathub: el job `update-flathub` solo corre para tags finales, y el job
# `build-bundle` arma un .flatpak instalable como artefacto del run para
# probar el RC antes de promover.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FLATHUB_REPO: flathub/com.digitalgex.RustDiff
  APP_ID: com.digitalgex.RustDiff

jobs:
  update-flathub:
    name: Update Flathub manifest
    runs-on: ubuntu-latest
    # Solo el push de un tag final: ni un RC ni un dispatch manual clonan,
    # bumpean ni abren PR en el repo de Flathub.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')

    steps:
      - name: Checkout rustdiff at the pushed tag
        uses: actions/checkout@v4

      - name: Resolve version
        id: tag
        run: |
          TAG="${{ github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # ── Frontend: tarball para el manifest ──────────────────────────────
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Build the frontend
        working-directory: desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Pack the frontend
        id: frontend
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          NAME="rustdiff-frontend-${VERSION}.tar.gz"
          # Un solo directorio de primer nivel (`dist/`): el manifest lo
          # extrae en desktop/dist con el strip-components=1 por defecto.
          # mtime/owner fijos para que re-runs produzcan el mismo hash.
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
              -C desktop -cf - dist | gzip -n > "$NAME"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$NAME" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/${{ github.repository }}/releases/download/${TAG}/${NAME}" >> "$GITHUB_OUTPUT"

      - name: Attach the frontend tarball to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.frontend.outputs.name }}
          # Tag con guion (v1.2.3-rc.1) = release candidate: el tarball va a un
          # prerelease, que nunca pasa a ser "latest".
          prerelease: ${{ contains(github.ref_name, '-') }}

      # ── Rust: fuentes offline ───────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        # aiohttp/toml/tomlkit: flatpak-cargo-generator.py
        # pyyaml: validar el manifest antes de pushear
        run: python3 -m pip install --user aiohttp toml tomlkit pyyaml

      - name: Download flatpak-cargo-generator.py
        run: |
          curl -fsSL \
            -o flatpak-cargo-generator.py \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py

      - name: Regenerate cargo-sources.json
        run: python3 flatpak-cargo-generator.py Cargo.lock -o cargo-sources.json

      - name: Clone Flathub repo
        env:
          FLATHUB_PAT: ${{ secrets.FLATHUB_PAT }}
        run: |
          if [ -z "$FLATHUB_PAT" ]; then
            echo "ERROR: FLATHUB_PAT secret is not set."
            echo "See .github/workflows/release-flathub.yml header for instructions."
            exit 1
          fi
          git clone \
            "https://x-access-token:${FLATHUB_PAT}@github.com/${FLATHUB_REPO}.git" \
            flathub-repo

      - name: Update manifest and open PR
        env:
          GH_TOKEN: ${{ secrets.FLATHUB_PAT }}
          TAG: ${{ steps.tag.outputs.tag }}
          COMMIT: ${{ github.sha }}
          FRONTEND_URL: ${{ steps.frontend.outputs.url }}
          FRONTEND_SHA256: ${{ steps.frontend.outputs.sha256 }}
        run: |
          set -euo pipefail
          cd flathub-repo

          # Rama nueva para el PR
          BRANCH="update-${TAG}"
          git checkout -b "$BRANCH"

          # La primera version Tauri (1.0.0) cambia la estructura del manifest
          # (nueva fuente del frontend): si el upstream todavia no la tiene,
          # se toma la del repo y despues se parchean tag/commit/url/sha256.
          MANIFEST="${APP_ID}.yaml"
          if ! grep -q 'rustdiff-frontend-' "$MANIFEST"; then
            cp "../flathub/${MANIFEST}" "$MANIFEST"
          fi

          # Fuente git (tag+commit) y tarball del frontend (url+sha256). El
          # manifest tiene un solo `sha256:`, el del tarball.
          sed -i -E \
              -e "s|^(\s*tag:)\s+.*|\1 ${TAG}|" \
              -e "s|^(\s*commit:)\s+.*|\1 ${COMMIT}|" \
              -e "s|^(\s*url:)\s+.*rustdiff-frontend-.*|\1 ${FRONTEND_URL}|" \
              -e "s|^(\s*sha256:)\s+.*|\1 ${FRONTEND_SHA256}|" \
              "$MANIFEST"

          # Reemplazar cargo-sources.json con el recién generado.
          cp ../cargo-sources.json .

          # Validación mínima: YAML bien formado, valores escritos,
          # cargo-sources no vacío.
          python3 -c "import yaml; yaml.safe_load(open('$MANIFEST'))"
          grep -q "${COMMIT}" "$MANIFEST"
          grep -q "${FRONTEND_SHA256}" "$MANIFEST"
          python3 -c "import json; assert json.load(open('cargo-sources.json'))"

          # Commit y push (force-with-lease para tolerar re-runs del workflow).
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "$MANIFEST" cargo-sources.json
          git commit -m "Update to ${TAG}"
          git push --force-with-lease -u origin "$BRANCH"

          # Abre el PR o avisa si ya existe (idempotente).
          if ! gh pr create \
              --repo "$FLATHUB_REPO" \
              --title "Update to ${TAG}" \
              --body "Automated update from rustdiff ${TAG} (commit ${COMMIT}). Regenerated cargo-sources.json via flatpak-cargo-generator; frontend bundle ${FRONTEND_URL}." \
              --head "$BRANCH" 2>&1 | tee /tmp/pr.out; then
              if grep -q "a pull request .* already exists" /tmp/pr.out; then
                  echo "PR ya existe, solo se actualizó la rama."
              else
                  cat /tmp/pr.out
                  exit 1
              fi
          fi

  # Arma un .flatpak instalable y lo deja como artefacto del run: es la forma de
  # probar un release candidate sin tocar el repo de Flathub (no usa el secret
  # del PAT ni abre PRs). Tambien sirve en dispatch manual.
  build-bundle:
    name: Build Flatpak bundle (RC / manual)
    runs-on: ubuntu-latest
    if: contains(github.ref_name, '-') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # En un tag el nombre sale del tag; en dispatch manual (rama por defecto,
      # sin tag) se lee la version que la rama tiene en tauri.conf.json.
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(python3 -c 'import json;print(json.load(open("desktop/src-tauri/tauri.conf.json"))["version"])')"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Bundle: rustdiff-${VERSION}.flatpak"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      # El manifest local toma `desktop/dist` del checkout: el frontend se
      # compila aca, no adentro del sandbox.
      - name: Build the frontend
        working-directory: desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add the Flathub remote
        # --user: la instalación de sistema (/var/lib/flatpak) es de root, así que
        # un remote-add sin privilegios fallaría en el runner.
        run: flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      # --install-deps-from resuelve runtime, SDK y sdk-extensions desde el
      # manifest: no hay que fijar a mano el branch de rust-stable.
      - name: Build the Flatpak
        run: |
          flatpak-builder --user --install-deps-from=flathub --repo=repo \
              --force-clean build-dir com.digitalgex.RustDiff.yaml

      - name: Create the bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          NAME="rustdiff-${VERSION}.flatpak"
          flatpak build-bundle repo "$NAME" com.digitalgex.RustDiff
          ls -l "$NAME"

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: rustdiff-flatpak-${{ steps.version.outputs.version }}
          path: rustdiff-${{ steps.version.outputs.version }}.flatpak
          if-no-files-found: error

# ─────────────────────────────────────────────
# WORKSPACE (virtual)
# ─────────────────────────────────────────────
# Desde F8 la raiz no es un paquete: la app GTK se retiro (D4) y la app es el
# shell Tauri de `desktop/src-tauri`. La logica vive en dos crates sin UI:
#
#   crates/rustdiff-core     formato, parseo, diff semantico, grafo, export
#   crates/rustdiff-persist  historial SQLite y preferencias
#   desktop/src-tauri        el shell Tauri v2 (binario `rustdiff`)
#
# La version y los metadatos compartidos viven aca: un solo lugar donde
# bumpear en cada release (y en desktop/package.json + tauri.conf.json, que
# no leen el workspace).
[workspace]
resolver = "3"
members  = ["crates/*", "desktop/src-tauri"]
# Un `cargo test` pelado en la raiz corre el nucleo y la persistencia, que
# compilan sin ninguna lib de sistema de UI.
#
# `desktop/src-tauri` queda FUERA a proposito: compilarlo arrastra todo Tauri y
# WebKitGTK (~200 crates) y exige las libs de desarrollo de WebKit, asi que
# incluirlo dejaria a quien trabaja solo en el nucleo sin poder correr los
# tests. El CI lo cubre con --workspace.
default-members = ["crates/*"]

[workspace.package]
version      = "1.0.1"
edition      = "2024"
rust-version = "1.85"
authors      = ["digitalgex <jpajaro@digitalgex.com>"]
license      = "GPL-3.0-or-later"
repository   = "https://github.com/jereok91/rustdiff"
homepage     = "https://github.com/jereok91/rustdiff"

# ─────────────────────────────────────────────
# PERFIL RELEASE
# ─────────────────────────────────────────────
[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"
panic         = "abort"

# ─────────────────────────────────────────────
# PERFIL DE DESARROLLO
# ─────────────────────────────────────────────
[profile.dev]
opt-level   = 1
# Solo tablas de linea: alcanza para backtraces legibles y enlazar deja de ser
# el cuello de botella (el binario de debug del shell pasaba los 100 MB).
debug       = 1
incremental = true
# En Linux el default es "off", que mete todo el DWARF dentro del binario:
# sacarlo aparte acelera el enlazado y achica el disco.
split-debuginfo = "unpacked"

# Las dependencias (Tauri, WebKit, glib, rusqlite...) son el 95% del codigo y
# nadie las depura a mano. Sin su info de debug, `cargo test` y `cargo build`
# bajan muchisimo de tiempo y de tamano.
[profile.dev.package."*"]
debug = false

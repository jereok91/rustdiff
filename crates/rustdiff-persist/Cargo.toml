# ─────────────────────────────────────────────
# PERSISTENCIA DEL USUARIO
# ─────────────────────────────────────────────
# Historial de sesiones (SQLite embebido) y preferencias. Tampoco conoce
# ninguna UI: el frontend pide todo por comandos, y asi conserva las reglas de
# validacion y los errores tipados que ya existian.
[package]
name    = "rustdiff-persist"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
description = "Historial de sesiones y preferencias de RustDiff"

# Interno del workspace por ahora (ver odd/tasks/tauri-migration.md, D7).
publish = false

[dependencies]
# El historial guarda un resumen del diff y el formato detectado.
rustdiff-core = { path = "../rustdiff-core" }

# ── PERSISTENCIA (SQLite embebido) ───────────
rusqlite = { version = "0.31", features = ["bundled", "backup"] }

# ── SERIALIZACION ────────────────────────────
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# ── I18N ─────────────────────────────────────
# `Session::display` traduce el resumen de una sesion guardada.
rust-i18n = "3"

# ── UTILIDADES ───────────────────────────────
dirs      = "5"
thiserror = "1"
tracing   = "0.1"

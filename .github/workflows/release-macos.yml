name: macOS DMG release

# Compila RustDiff (shell Tauri v2) en runners macOS nativos (Intel y Apple
# Silicon) con `pnpm tauri build --bundles dmg`, adjunta ambos DMG al release
# del tag y actualiza el Cask `rustdiff-app` en el tap
# jereok91/homebrew-rustdiff.
#
# La app usa el WebKit del sistema (WKWebView): el .app ya no
# empaqueta ninguna lib de Homebrew, asi que no hace falta reubicar dylibs.
#
# Requiere el secret HOMEBREW_TAP_PAT (PAT con permiso de escritura sobre el
# tap) para el job de actualización del Cask.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (ej. v1.0.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-dmg:
    name: Build DMG (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub retiró los runners macos-13; macos-15-intel es la etiqueta
          # Intel (x64) gratuita vigente. macos-14+ es Apple Silicon.
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${{ github.ref_name }}}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # En push de tag se compila exactamente el tag. En dispatch manual
          # se compila la rama por defecto: permite re-lanzar el empaquetado
          # de un release con fixes de CI sin mover el tag publicado.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || steps.tag.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-release-

      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      # Firma ad-hoc (`bundle.macOS.signingIdentity: "-"` en tauri.conf.json):
      # no hay certificado de Apple Developer.
      - name: Build RustDiff.app and DMG
        working-directory: desktop
        run: pnpm tauri build --bundles dmg

      - name: Smoke-test bundle and rename DMG
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          APP="target/release/bundle/macos/RustDiff.app"
          test -f "$APP/Contents/Info.plist"
          test -x "$APP/Contents/MacOS/rustdiff"
          codesign --verify --deep "$APP"
          # El binario solo puede enlazar frameworks del sistema.
          if otool -L "$APP/Contents/MacOS/rustdiff" | tail -n +2 | grep -vE '^\s*(/System/|/usr/lib/)'; then
            echo "The binary links libraries outside the system paths."
            exit 1
          fi

          shopt -s nullglob
          dmgs=(target/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "Expected exactly one DMG, found ${#dmgs[@]}."
            exit 1
          fi
          # Mismo nombre que antes de 1.0.0: el cask arma la URL con él.
          mkdir -p dist
          cp "${dmgs[0]}" "dist/RustDiff-${VERSION}-macos-${ARCH}.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: RustDiff-${{ steps.tag.outputs.version }}-macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

      - name: Attach DMG to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: dist/*.dmg

  update-cask:
    name: Update Homebrew cask
    needs: build-dmg
    runs-on: ubuntu-latest
    env:
      TAP_REPO: jereok91/homebrew-rustdiff
      CASK: Casks/rustdiff-app.rb

    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${{ github.ref_name }}}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Compute DMG sha256 (both arches)
        id: sha
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          for arch in arm64 x86_64; do
            URL="${BASE}/RustDiff-${VERSION}-macos-${arch}.dmg"
            SHA=$(curl -fsSL "$URL" | sha256sum | cut -d' ' -f1)
            echo "${arch}=${SHA}" >> "$GITHUB_OUTPUT"
          done

      - name: Clone tap repo
        env:
          HOMEBREW_TAP_PAT: ${{ secrets.HOMEBREW_TAP_PAT }}
        run: |
          if [ -z "$HOMEBREW_TAP_PAT" ]; then
            echo "ERROR: HOMEBREW_TAP_PAT secret is not set."
            exit 1
          fi
          git clone \
            "https://x-access-token:${HOMEBREW_TAP_PAT}@github.com/${TAP_REPO}.git" \
            tap-repo

      - name: Write cask and push
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          SHA_ARM: ${{ steps.sha.outputs.arm64 }}
          SHA_INTEL: ${{ steps.sha.outputs.x86_64 }}
        run: |
          set -euo pipefail
          cd tap-repo
          mkdir -p Casks

          cat > "$CASK" <<EOF
          cask "rustdiff-app" do
            version "${VERSION}"

            arch arm: "arm64", intel: "x86_64"
            sha256 arm:   "${SHA_ARM}",
                   intel: "${SHA_INTEL}"

            url "https://github.com/${{ github.repository }}/releases/download/v#{version}/RustDiff-#{version}-macos-#{arch}.dmg"
            name "RustDiff"
            desc "Semantic JSON/XML/SQL diff tool"
            homepage "https://github.com/${{ github.repository }}"

            app "RustDiff.app"
            binary "#{appdir}/RustDiff.app/Contents/MacOS/rustdiff"

            caveats <<~CAVEATS
              RustDiff.app is ad-hoc signed (no Apple Developer certificate).
              If macOS blocks the first launch, either right-click the app and
              choose "Open", or clear the quarantine attribute with:
                xattr -cr /Applications/RustDiff.app
            CAVEATS

            zap trash: [
              "~/Library/Application Support/rustdiff",
              "~/Library/Application Support/com.digitalgex.RustDiff",
              "~/Library/Caches/com.digitalgex.RustDiff",
              "~/Library/WebKit/com.digitalgex.RustDiff",
            ]
          end
          EOF

          ruby -c "$CASK"
          grep -q "version \"${VERSION}\"" "$CASK"
          grep -q "${SHA_ARM}" "$CASK"
          grep -q "${SHA_INTEL}" "$CASK"

          # Idempotente: re-runs sin cambios terminan en éxito.
          if git diff --quiet && [ -z "$(git status --porcelain "$CASK")" ]; then
            echo "El cask ya está en ${VERSION}; nada que hacer."
            exit 0
          fi

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "$CASK"
          git commit -m "rustdiff-app ${VERSION} (macOS DMG)"
          git push origin HEAD

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512">
  <!-- Fondo 100% transparente -->

  <!-- Left Brace '{' (JSON / AST) in Emerald Green -->
  <path d="M 11 7 C 8.5 7 7.5 8.5 7.5 12 C 7.5 14.5 6 16 4.5 16 C 6 16 7.5 17.5 7.5 20 C 7.5 23.5 8.5 25 11 25" 
        fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Right Angle Bracket '>' (XML / Tags) in Rust Orange -->
  <path d="M 21 8 L 27.5 16 L 21 24" 
        fill="none" stroke="#F97316" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Diff Token '≠' en Violeta / Índigo Saturado (#6366F1 / #4F46E5) -->
  <!-- El índigo tiene un contraste óptimo calculado de 4.5:1+ tanto en fondos blancos puros como en fondos negros profundos -->
  <!-- Horizontal equal bars in Vivid Indigo -->
  <line x1="12.5" y1="13.8" x2="19.5" y2="13.8" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" />
  <line x1="12.5" y1="18.2" x2="19.5" y2="18.2" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Slash inequality line in Electric Purple (#818CF8 / #A855F7) -->
  <line x1="18.5" y1="11" x2="13.5" y2="21" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round" />
</svg>
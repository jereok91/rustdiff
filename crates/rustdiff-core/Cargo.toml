# ─────────────────────────────────────────────
# NUCLEO SIN UI
# ─────────────────────────────────────────────
# Formato, parseo, diff semantico, grafo y export. No conoce GTK ni Tauri:
# la invariante la sostiene `tests/no_ui_dependencies.rs`. Es la parte de la
# aplicacion que sobrevive a cualquier cambio de toolkit.
[package]
name    = "rustdiff-core"
version.workspace     = true
edition.workspace     = true
rust-version.workspace = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
homepage.workspace    = true
description = "Motor semantico de comparacion (JSON, XML, SQL y texto) de RustDiff, sin UI"

# Interno del workspace por ahora: publicar en crates.io exige decidir el
# orden de publicacion de los miembros (ver odd/tasks/tauri-migration.md, D7).
publish = false

# ── SERIALIZACION / PARSEO ───────────────────
[dependencies]
serde_json = "1"
quick-xml  = { version = "0.36", features = ["serialize"] }
sqlformat  = "0.3"

# ── DIFF DE TEXTO ────────────────────────────
similar    = { version = "2", features = ["text", "unicode"] }

# ── UTILIDADES ───────────────────────────────
thiserror  = "1"

# ── I18N ─────────────────────────────────────
# Las cadenas de usuario que el nucleo genera (export, sesiones guardadas)
# salen de los mismos locales/*.yml que la app GTK.
rust-i18n  = "3"

# ─────────────────────────────────────────────
# DEPENDENCIAS DE TEST
# ─────────────────────────────────────────────
[dev-dependencies]
pretty_assertions = "1"
